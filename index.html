<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>✨ My To-Do List</h1>
        
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..." 
                autocomplete="off"
            >
            
            <select id="prioritySelect">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <input 
                type="date" 
                id="dueDateInput"
            >
            
            <button id="addBtn">Add Task</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search tasks..." 
                autocomplete="off"
            >
        </div>

        <ul id="taskList" class="task-list">
            <!-- Tasks will be added here dynamically -->
        </ul>

        <div class="stats">
            <p>Total: <span id="totalTasks">0</span> | Completed: <span id="completedTasks">0</span> | Pending: <span id="pendingTasks">0</span></p>
        </div>

        <div class="action-buttons">
            <button id="clearCompletedBtn" class="clear-btn">Clear Completed</button>
            <button id="exportBtn" class="export-btn">Export Tasks</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
